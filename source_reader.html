    const path=view==='original'?paper.original_path:view==='de'?paper.german_path:paper.english_path;
    try{
      const warning=view==='de'?germanStatusNote(paper):'';
      v.innerHTML=`<div class="viewpad md-render">${warning}${md(await get(path),path)}</div>`;
      renderMath(v);bindPopovers(v);
    }catch(e){v.innerHTML=`<div class="empty">${tr('Textdatei nicht verfügbar.','Text file unavailable.')}<br>${esc(e.message)}</div>`}return;
  }
  if(view==='equations'){
    const key=(paper.key_equations||[]).map(e=>`<article class="eq"><div class="math-block" data-tex="${esc(e.latex)}"></div><p>${esc(lang==='de'?e.meaning_de:e.meaning_en)}</p></article>`).join('');
    const actual=(paper.equations||[]).map((e,i)=>`<article class="eq"><button class="btn" data-page="${e.page}">${tr('Ausschnitt S.','Excerpt p.')} ${e.page}</button><small>${tr('OCR-Rohformel (nicht automatisch gesetzt)','Raw OCR formula (not typeset automatically)')} ${i+1}</small><pre class="ocr-math-raw">${esc(normalizeTex(e.latex))}</pre></article>`).join('');
    v.innerHTML=`<div class="viewpad"><h2>${tr('Verifizierte Schlüsselgleichungen des Kurses','Verified course key equations')}</h2><div class="eq-list">${key||'<div class="empty">—</div>'}</div><h2>${tr('Im OCR erkannte Gleichungen','Equations recognized in OCR')}</h2><p class="meta">${tr('OCR-Formeln können Erkennungsfehler enthalten. Jeder Eintrag führt deshalb zur zugehörigen Seite.','OCR equations can contain recognition errors. Each entry therefore links to its source page.')}</p><div class="eq-list">${actual||`<div class="empty">${tr('Keine Display-Gleichungen gefunden.','No display equations found.')}</div>`}</div></div>`;
    renderMath(v);v.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{pageNo=+b.dataset.page;view='excerpt';renderView()});return;
  }
  if(view==='sources'){
    const eqPages=[...new Set((paper.equations||[]).map(e=>e.page))].slice(0,20);
    const availability=hasGermanFullText(paper)
      ?tr('Verfügbar sind die Kursaufbereitung auf Deutsch und Englisch, die Textfassungen, Seiten-OCR und das PDF.','Available: German and English course preparations, text versions, page OCR, and the PDF.')
      :tr('Verfügbar sind die Kursaufbereitung auf Deutsch und Englisch, die englische Textfassung, Seiten-OCR und das PDF. Die Schaltfläche „Deutsch“ öffnet eine geprüfte deutsche Aufbereitung, keine Volltextübersetzung.','Available: German and English course preparations, the English text version, page OCR, and the PDF. The “German” button opens a reviewed German preparation rather than a full-text translation.');
    v.innerHTML=`<div class="viewpad source-grid"><article class="source-card"><h3>${tr('Bibliografie','Bibliography')}</h3><p>${esc(paper.authors)} (${paper.year}). <b>${esc(paper.titles[lang])}</b>. ${esc(paper.journal||'')} ${esc(paper.page_range||'')}</p><div class="source-actions">${paper.doi?`<a class="btn" href="https://doi.org/${esc(paper.doi.replace(/^https?:\/\/doi.org\//,''))}" target="_blank" rel="noopener">DOI ↗</a>`:''}<a class="btn" href="${paper.pdf_path}">PDF ↗</a></div></article><article class="source-card"><h3>${tr('Verfügbare Fassungen','Available versions')}</h3><p>${availability}</p><div class="source-actions"><button class="btn" data-go="summary">${tr('Aufbereitung','Preparation')}</button><button class="btn" data-go="original">${tr('Eingebettete Textfassung','Embedded text')}</button><button class="btn" data-go="de">${hasGermanFullText(paper)?'Deutsch':tr('Deutsch · Aufbereitung','German · preparation')}</button><button class="btn" data-go="en">English</button></div></article><article class="source-card"><h3>${tr('Seiten mit Gleichungen','Pages containing equations')}</h3><div class="source-actions">${eqPages.length?eqPages.map(n=>`<button class="btn" data-excerpt="${n}">${tr('Seite','Page')} ${n}</button>`).join(''):'—'}</div></article><article class="source-card"><h3>${tr('Dateipfade','File paths')}</h3><p><code>${esc(paper.pdf_path)}</code><br><code>${esc(paper.summary_de_path)}</code><br><code>${esc(paper.original_path)}</code></p></article></div>`;
    v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;renderView()});
    v.querySelectorAll('[data-excerpt]').forEach(b=>b.onclick=()=>{pageNo=+b.dataset.excerpt;view='excerpt';renderView()});return;
  }
  if(view==='images'){
    v.innerHTML=`<div class="viewpad gallery">${paper.images?.length?paper.images.map(im=>{const cap=im['caption_'+lang]||`${tr('Primärquellenbild','Primary-source image')} · ${tr('Seite','page')} ${im.page||1}`;return`<figure><button data-pop-src="${esc(im.path)}" data-pop-caption="${esc(cap)}"><img src="${esc(im.path)}" alt="${esc(cap)}"></button><figcaption>${esc(cap)}<br><button class="btn" data-page="${im.page||1}">${tr('Seitenkontext öffnen','Open page context')}</button></figcaption></figure>`}).join(''):`<div class="empty">${tr('Keine extrahierten Bilder für dieses Paper.','No extracted images for this paper.')}</div>`}</div>`;
    bindPopovers(v);v.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{pageNo=+b.dataset.page;view='excerpt';renderView()});
  }
}
function setLanguage(next){lang=next;localStorage.setItem('qm_language',next);document.documentElement.lang=next;document.querySelectorAll('[data-de]').forEach(e=>e.textContent=e.dataset[next]);$('search').placeholder=tr('Paper suchen','Search papers');renderList();if(paper)select(paper.folder)}
$('langDE').onclick=()=>setLanguage('de');$('langEN').onclick=()=>setLanguage('en');$('themeToggle').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';$('search').oninput=renderList;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;renderView()});
(function init(){const d=window.QM_SOURCE_DATA;if(!d||!Array.isArray(d.papers)){$('view').innerHTML=`<div class="empty">${tr('Der eingebettete Quellenindex fehlt.','The bundled source index is missing.')}</div>`;return}data=d.papers;$('view').innerHTML=`<div class="empty">${tr('Quelle wird geladen …','Loading source …')}</div>`;const q=new URLSearchParams(location.search);view=q.get('view')||'summary';pageNo=Math.max(1,+q.get('page')||1);setLanguage(lang);renderList();select(q.get('paper')||data[0].folder)})();
